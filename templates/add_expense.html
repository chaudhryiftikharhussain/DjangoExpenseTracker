{% extends 'base.html' %}


{% block content %}

<form method="post">
    {% csrf_token %}

    <div class="mb-3">

<label class="form-label">
            Category
        </label>
        {{ form.category }}
        <label class="form-label">
            amount
        </label>
        {{ form.amount }}
        <label class="form-label">
            des
        </label>
        {{ form.description }}
        <label class="form-label">
            date
        </label>
        {{ form.date }}

    </div>

    <button type="submit" class="btn btn-primary">
        Save Expense
    </button>
</form>

{% endblock content %}
