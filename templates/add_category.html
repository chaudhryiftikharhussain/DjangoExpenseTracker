{% extends 'base.html' %}


{% block content %}

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">
            Category Name
        </label>

        {{ form.name }}

    </div>

    <button type="submit" class="btn btn-primary">
        Save Category
    </button>
</form>

{% endblock content %}
